<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Lehrerbereich</title></head><body><header><div><small>À plus! Trainer Pro</small><h1>Lehrerbereich</h1></div><a href="index.html">Schüler</a></header><main>
<section id="loginBox" class="card"><h2>Anmelden</h2><div class="grid"><label>E-Mail<input id="email" type="email"></label><label>Passwort<input id="password" type="password"></label></div><button id="login">Anmelden</button><p id="loginStatus" class="muted"></p></section>
<section id="teacherBox" class="card hidden"><div class="meta"><h2>Tests verwalten</h2><button id="logout" class="alt">Abmelden</button></div><h3>Neuen Test erstellen</h3><div class="grid"><label>Titel<input id="title" value="Band 4 – Unité 1"></label><label>Klasse<input id="className"></label><label>Testcode<input id="code" placeholder="9A-U1V1"><small>4–24 Zeichen: A–Z, 0–9, Bindestrich</small></label><label>Aufgabentyp<select id="taskType"><option value="vocab">Vokabeln</option><option value="sentence">Ganze Sätze</option><option value="mixed">Gemischt</option></select></label><label>Bereich<select id="section"></select></label><label>Richtung<select id="direction"><option value="de-fr">Deutsch → Französisch</option><option value="fr-de">Französisch → Deutsch</option><option value="mixed">Gemischt</option></select><small id="directionNote" class="muted"></small></label><label>Anzahl<select id="count"><option>10</option><option>15</option><option>20</option><option value="all">Alle</option></select></label><label>Zeitlimit in Minuten<input id="timeLimit" type="number" min="1" max="180" value="15"></label><label class="check"><input id="extra" type="checkbox"> Zusatzwortschatz einbeziehen</label></div>
<h3>Notenschlüssel</h3><div class="grading-grid"><label>1+ ab %<input id="g1p" type="number" value="95"></label><label>1 ab %<input id="g1" type="number" value="90"></label><label>2+ ab %<input id="g2p" type="number" value="85"></label><label>2 ab %<input id="g2" type="number" value="75"></label><label>3 ab %<input id="g3" type="number" value="65"></label><label>4 ab %<input id="g4" type="number" value="50"></label></div>
<div class="actions"><button id="createTest">Test erstellen</button></div><p id="createStatus" class="muted"></p><h3>Meine Tests & Ergebnisse</h3><div class="actions"><button id="refresh" class="alt">Aktualisieren</button><button id="csv" class="alt">CSV für Numbers</button></div><div id="dashboard"></div></section></main><script type="module" src="teacher.js"></script></body></html>
