<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f5f"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Französisch-Test</title></head><body><header><div><small>À plus! Trainer Pro</small><h1>Französisch-Test</h1></div><a href="teacher.html">Lehrer</a></header><main>
<section class="card mode-card"><h2>Was möchtest du machen?</h2><div class="mode-actions"><a class="mode-button practice-link" href="practice.html">📚 Französisch üben</a><span class="muted">oder einen benoteten Test mit Testcode schreiben:</span></div></section>
<section id="join" class="card"><h2>Test starten</h2><div class="grid"><label>Name oder Kürzel<input id="studentName" autocomplete="name"></label><label>Klasse<input id="studentClass"></label><label>Testcode<input id="testCode" autocapitalize="characters"></label></div><button id="joinBtn">Starten</button><p id="joinStatus" class="muted"></p></section>
<section id="quiz" class="card hidden"><div class="meta"><b id="progress"></b><b id="timer"></b></div><div class="bar"><i id="bar"></i></div><p class="muted">Übersetze:</p><h2 id="prompt"></h2><label>Antwort<input id="answer" autocomplete="off" autocapitalize="none" spellcheck="false"></label><div class="actions"><button id="next">Weiter</button></div></section>
<section id="result" class="card hidden"><h2>Test beendet</h2><div id="percent" class="percent"></div><h3 id="grade"></h3><p id="resultText"></p><div id="wrongAnswers"></div></section></main><script type="module" src="student.js"></script></body></html>
