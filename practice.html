<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f5f"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Vokabeln üben</title></head><body><header><div><small>À plus! Trainer Pro</small><h1>Vokabeln üben</h1></div><a href="index.html">Testmodus</a></header><main>
<section id="setup" class="card"><h2>Übung zusammenstellen</h2><p class="muted">Der Übungsmodus funktioniert ohne Lehrer-Login und ohne Supabase.</p><div class="grid"><label>Bereich<select id="section"><option value="all">Alle Lernvokabeln</option><option value="Auftaktseite">Auftaktseite</option><option value="Vocabulaire thématique">Vocabulaire thématique</option><option value="Volet 1">Volet 1</option><option value="Volet 2">Volet 2</option></select></label><label>Abfragerichtung<select id="direction"><option value="de-fr">Deutsch → Französisch</option><option value="fr-de">Französisch → Deutsch</option><option value="mixed">Gemischt</option></select></label><label>Anzahl<select id="count"><option>10</option><option>15</option><option>20</option><option value="all">Alle</option></select></label><label class="check"><input type="checkbox" id="extra"> Zusatzwortschatz einbeziehen</label></div><button id="startPractice">Übung starten</button><p id="setupStatus" class="muted"></p></section>
<section id="practice" class="card hidden"><div class="meta"><b id="practiceProgress"></b><b id="practiceScore"></b></div><div class="bar"><i id="practiceBar"></i></div><p class="muted">Übersetze:</p><h2 id="practicePrompt"></h2><label>Antwort<input id="practiceAnswer" autocomplete="off" autocapitalize="none" spellcheck="false"></label><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="checkAnswer">Prüfen</button><button id="nextPractice" class="hidden">Weiter</button></div></section>
<section id="practiceResult" class="card hidden"><h2>Übung beendet</h2><div id="practicePercent" class="percent"></div><h3 id="practiceResultText"></h3><div id="practiceMistakes"></div><div class="actions"><button id="repeatWrong" class="hidden">Fehler noch einmal üben</button><button id="newPractice" class="alt">Neue Übung</button></div></section>
</main><script src="practice.js"></script></body></html>
